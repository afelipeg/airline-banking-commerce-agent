[pytest]
# -p by entry-point name loads asyncio whether or not plugin autoload is disabled; importlib
# mode lets suites share file names.
addopts = -p asyncio --import-mode=importlib
asyncio_mode = auto
# airline.api and demo_common import as top-level packages, as `uvicorn --app-dir .` runs them.
pythonpath = .
testpaths =
    airline/api/tests
